# 외부 MySQL 8 서버. 접속 정보는 .env(개발·테스트, dotenv-rails) 또는 셸 환경변수(production)에서 읽는다.
# 키 목록은 .env.example 참고. DB 이름은 고정.
#
# - ssl_mode:  JDBC ssl-mode=REQUIRED 대응. mysql2 가 libmysqlclient 의 MYSQL_OPT_SSL_MODE 로 전달.
# - variables.time_zone: JDBC serverTimezone 대응. 접속 직후 SET @@SESSION.time_zone 으로 적용.
#   (Rails 는 DATETIME 컬럼에 UTC 를 기록하므로 모델 값에는 영향이 없고, NOW()/TIMESTAMP 해석에만 쓰인다)
# - variables.sql_mode: 외부 서버의 전역 sql_mode 가 ANSI(ANSI_QUOTES, PIPES_AS_CONCAT 포함)라서
#   MySQL 8 기본값 + Rails 권장(STRICT_ALL_TABLES, NO_AUTO_VALUE_ON_ZERO)으로 세션마다 고정한다.
default: &default
  adapter: mysql2
  encoding: utf8mb4
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("HOMEFIT_DB_HOST") { "127.0.0.1" } %>
  port: <%= ENV.fetch("HOMEFIT_DB_PORT") { 3306 } %>
  username: <%= ENV.fetch("HOMEFIT_DB_USERNAME") { "homefit" } %>
  password: <%= ENV["HOMEFIT_DB_PASSWORD"] %>
  ssl_mode: <%= ENV.fetch("HOMEFIT_DB_SSL_MODE") { "required" } %>
  variables:
    time_zone: <%= ENV.fetch("HOMEFIT_DB_TIMEZONE") { "Asia/Seoul" } %>
    sql_mode: ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,STRICT_ALL_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION,NO_AUTO_VALUE_ON_ZERO

development:
  <<: *default
  database: homefit_development

# "test" DB 는 테스트 실행 시 비워지고 다시 만들어진다. development 와 같은 이름을 쓰지 말 것.
test:
  <<: *default
  database: homefit_test

# production 은 Solid Cache/Queue/Cable 이 각자 DB 를 쓴다 (Rails 8 기본 구성).
production:
  primary: &primary_production
    <<: *default
    database: homefit_production
  cache:
    <<: *primary_production
    database: homefit_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: homefit_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: homefit_production_cable
    migrations_paths: db/cable_migrate
