<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>페이지를 찾을 수 없습니다 (404) · HomeFit</title>
  <style>
    html { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; background: #f6f7f9; color: #1f2937; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 32px 24px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 1px 8px rgb(0 0 0 / 4%); }
    .code { font-size: 0.8rem; color: #6b7280; letter-spacing: 0.1em; margin: 0 0 8px; }
    h1 { font-size: 1.3rem; margin: 0 0 8px; }
    p { margin: 0 0 20px; color: #6b7280; line-height: 1.5; }
    a { display: inline-block; padding: 8px 16px; border-radius: 10px; background: #2563eb; color: #fff; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <main class="card">
    <p class="code">HOMEFIT · 404</p>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>주소가 잘못됐거나 삭제된 항목입니다.</p>
    <a href="/">주택 목록으로</a>
  </main>
</body>
</html>
